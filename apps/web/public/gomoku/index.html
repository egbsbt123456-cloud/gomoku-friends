<!doctype html>

<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五子棋</title><style>
/* ===== 主站设计令牌（与 示例主站 一致） ===== */
html { font-family: Inter, "Microsoft YaHei", sans-serif; font-synthesis: none; }
body {
  height: 100%; margin: 0;
  background: #f8f7f2;             /* 主站米白底 */
  color: #223b34;                  /* 主站正文色 */
  font-family: Inter, "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid #d29f41; outline-offset: 5px; }
a { color: inherit; text-decoration: none; }

/* ---- 主站 play-header（照搬 sweeper-page 三列头部） ---- */
.play-header {
  flex: none;
  height: 76px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid #e2e4dc;
  padding: 0 28px;
  background: #f8f7f2;
}
.back { font-size: 13px; color: #788477; justify-self: start; }
.play-header h1 {
  font-size: 21px; line-height: 1.3; letter-spacing: 0;
  font-weight: 750; white-space: nowrap; margin: 0;
}
.play-header h1 > .glyph { color: #426850; font-size: 25px; margin-right: 6px; }
.play-header h1 small { font-size: 10px; font-weight: 400; color: #859080; margin-left: 4px; }
.header-side { justify-self: end; font-size: 12px; display: flex; align-items: center; gap: 10px; }

/* ---- 连接状态（照搬主站 .connection：7px 圆点 + 12px 文案） ---- */
.connection { font-size: 12px; color: #6d786e; display: flex; gap: 7px; align-items: center; }
.connection i { width: 7px; height: 7px; border-radius: 50%; background: #9b9d94; }
.connection i.online { background: #4b8064; }

/* ---- 按钮（照搬主站 AccountPanel：#f8faf5 底 #264f40 字） ---- */
.plain-btn {
  border: 1px solid #bcc9bd; border-radius: 5px;
  background: #f8faf5; color: #264f40;
  padding: 9px 12px; font-size: 13px;
}
.plain-btn:hover { background: #eef1e7; }
.plain-btn:disabled { opacity: .5; cursor: wait; }

/* ---- 提示条（照搬主站 .notice：#f0f3e9 底 #496047 字 7px 圆角） ---- */
.message {
  position: fixed; top: 92px; left: 0; z-index: 1010;
  width: 100%; pointer-events: none; text-align: center;
  margin: 0; padding: 0; list-style: none;
}
.message > div { padding: 6px; }
.message > div > div {
  display: inline-block;
  padding: 12px 18px;
  background: #f0f3e9;
  border: 1px solid #d6dfcd;
  border-radius: 7px;
  box-shadow: 0 3px 7px #2d51381c;
  color: #496047;
  font-size: 12px; line-height: 1.8;
  font-variant-numeric: tabular-nums;
  pointer-events: all;
}

/* ---- 棋盘（原版布局，仅容器化适配头部） ---- */
.board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px 12px; }
#svg { height: 100%; width: 100%; max-width: min(92vmin, 640px); }

@media (max-width: 600px) {
  .play-header { height: 62px; padding: 0 14px; gap: 5px; }
  .play-header h1 { font-size: 18px; }
  .play-header h1 small { display: none; }
  .back { font-size: 12px; }
  .message { top: 70px; }
  .board-wrap { padding: 10px 6px; }
}

body{height:auto;min-height:100vh}.play-header{height:auto;min-height:58px;display:flex;gap:12px;padding:12px 20px;justify-content:space-between;flex-wrap:wrap}.play-header .controls{display:flex;gap:8px}.board-wrap{flex:none;padding:14px 12px}#svg{display:block;width:min(100%,640px);height:auto;max-width:640px;aspect-ratio:1;margin:auto;touch-action:manipulation}.game-status{text-align:center;margin:4px 14px 12px;color:#496047;font-size:13px}.rule-note{color:#808570;text-align:center;font-size:11px;margin:8px 12px 20px}.game-status.over{color:#926741;font-weight:700}#modeLabel{font-size:13px;color:#69786d}.message{top:68px}button[hidden]{display:none}@media(max-width:600px){.play-header{padding:10px 12px;gap:8px}.plain-btn{font-size:12px;padding:7px 10px}.board-wrap{padding:12px 6px}}

/* 木色棋盘与墨绿主站搭配；规则和落子坐标保持不变。 */
.board-wrap{padding:20px 14px 18px}#svg{border-radius:14px;filter:drop-shadow(0 12px 18px #74542e21) drop-shadow(0 2px 3px #74542e1c)}
#svg>rect:last-child{fill:#bc5e48;stroke:#fff9ed;stroke-width:.3;rx:.35}
@media(max-width:600px){.board-wrap{padding:16px 8px}#svg{border-radius:9px;filter:drop-shadow(0 6px 10px #74542e26)}}
</style></head><body>
